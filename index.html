<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Excel Tools Hub</title>
<style>
:root {
  --bg:#f5f7fb;
  --panel:#ffffff;
  --text:#172033;
  --muted:#6b7280;
  --line:#e5e7eb;
  --primary:#2563eb;
  --green:#0f766e;
}
* { box-sizing:border-box; }
body {
  margin:0;
  font-family:Inter, Pretendard, "Noto Sans KR", Arial, sans-serif;
  background:var(--bg);
  color:var(--text);
}
.shell {
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
.header {
  background:#fff;
  border-bottom:1px solid var(--line);
  padding:16px 20px;
  position:sticky;
  top:0;
  z-index:20;
}
.header-inner {
  max-width:1400px;
  margin:0 auto;
  display:flex;
  align-items:center;
  gap:14px;
  flex-wrap:wrap;
}
.brand {
  font-weight:900;
  font-size:20px;
  margin-right:auto;
}
.sub {
  color:var(--muted);
  font-size:12px;
}
.tabs {
  display:flex;
  gap:8px;
  flex-wrap:wrap;
}
.tab {
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  border-radius:10px;
  padding:10px 15px;
  font-weight:800;
  cursor:pointer;
}
.tab.active {
  background:var(--primary);
  color:#fff;
  border-color:var(--primary);
}
.tab.extract.active {
  background:var(--green);
  border-color:var(--green);
}
.content {
  flex:1;
  min-height:0;
  padding:12px;
}
.frame-wrap {
  width:100%;
  max-width:1600px;
  margin:0 auto;
  height:calc(100vh - 94px);
  min-height:650px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  overflow:hidden;
}
iframe {
  width:100%;
  height:100%;
  border:0;
  display:block;
  background:#fff;
}
@media(max-width:700px) {
  .brand { width:100%; }
  .content { padding:6px; }
  .frame-wrap {
    height:calc(100vh - 145px);
    min-height:560px;
    border-radius:10px;
  }
  .tab { flex:1; }
}
</style>
</head>
<body>
<div class="shell">
  <header class="header">
    <div class="header-inner">
      <div>
        <div class="brand">Excel Tools Hub</div>
        <div class="sub">하나의 HTML에서 파일 병합과 데이터 추출을 전환합니다.</div>
      </div>
      <div class="tabs">
        <button class="tab active" id="mergeTab" type="button">🗂 파일 병합기</button>
        <button class="tab extract" id="extractTab" type="button">🔎 데이터 추출기</button>
      </div>
    </div>
  </header>

  <main class="content">
    <div class="frame-wrap">
      <iframe id="toolFrame" title="Excel 도구"></iframe>
    </div>
  </main>
</div>

const frame = document.getElementById("toolFrame");
const mergeTab = document.getElementById("mergeTab");
const extractTab = document.getElementById("extractTab");

function showTool(type) {
  const isMerge = type === "merge";
  frame.src = isMerge ? mergerData : extractorData;
  mergeTab.classList.toggle("active", isMerge);
  extractTab.classList.toggle("active", !isMerge);
}

mergeTab.addEventListener("click", () => showTool("merge"));
extractTab.addEventListener("click", () => showTool("extract"));

showTool("merge");
</script>
